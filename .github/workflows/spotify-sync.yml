name: Spotify – dociąganie odsłuchów

on:
  schedule:
    # Dwa razy na godzinę (Spotify oddaje tylko 50 ostatnich utworów, więc trzeba pytać często;
    # GitHub potrafi pominąć pojedyncze uruchomienia, a duplikaty odsłuchów i tak są odfiltrowane).
    - cron: '7,37 * * * *'
  workflow_dispatch:
    inputs:
      code:
        description: 'Kod ze strony spotify.html (przy podłączaniu konta albo po wygaśnięciu logowania). Puste = zwykła synchronizacja.'
        required: false
        default: ''
      konto:
        description: 'Które konto (1 = Ty, 2–5 = znajomi)'
        type: choice
        options: ['1', '2', '3', '4', '5']
        default: '1'
      nazwa:
        description: 'Nazwa konta na stronie (opcjonalnie, np. imię znajomego)'
        required: false
        default: ''
      odlacz:
        description: 'Odłącz to konto i usuń jego dane'
        type: boolean
        default: false
      wyczysc_historie:
        description: 'Po zaszyfrowaniu: usuń starą (jawną) historię gałęzi dane — zostaje jeden commit z obecnymi, zaszyfrowanymi plikami. Nieodwracalne.'
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

jobs:
  sync:
    concurrency:
      group: spotify-sync
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          path: app

      - name: Pobierz gałąź „dane”
        run: |
          if git ls-remote --exit-code --heads "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" dane >/dev/null; then
            git clone --depth 1 --branch dane "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" dane
          else
            mkdir dane && cd dane && git init -q -b dane
            git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Odłącz konto
        if: ${{ inputs.odlacz == true }}
        env:
          SPOTIFY_SLOT: ${{ inputs.konto }}
          SPOTISTATS_HASLO: ${{ secrets.SPOTISTATS_HASLO }}
        run: node app/scripts/spotify-sync.mjs disconnect dane

      - name: Połącz ze Spotify
        if: ${{ inputs.odlacz != true && inputs.code != '' && inputs.code != null }}
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_CODE: ${{ inputs.code }}
          SPOTIFY_SLOT: ${{ inputs.konto }}
          SPOTIFY_NAME: ${{ inputs.nazwa }}
          SPOTISTATS_HASLO: ${{ secrets.SPOTISTATS_HASLO }}
        run: node app/scripts/spotify-sync.mjs connect dane

      - name: Dociągnij ostatnie odsłuchy
        if: ${{ inputs.odlacz != true && (inputs.code == '' || inputs.code == null) }}
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTISTATS_HASLO: ${{ secrets.SPOTISTATS_HASLO }}
        run: node app/scripts/spotify-sync.mjs sync dane

      - name: Zapisz zmiany na gałęzi „dane”
        if: always()
        working-directory: dane
        run: |
          if [ "${{ inputs.wyczysc_historie }}" = "true" ]; then
            # Tylko na wyraźne życzenie (Run workflow → „usuń starą historię”) i tylko gdy wszystko jest już zaszyfrowane.
            if grep -rLs --include='*.json' '"szyfr":1' . | grep -v '^./.git/' | grep -q .; then
              echo "::error::Nie wszystkie pliki są zaszyfrowane (brak sekretu SPOTISTATS_HASLO?) — historii nie ruszam."; exit 1
            fi
            git checkout -q --orphan nowa-dane
            git add -A
            git -c user.name="spotistats-bot" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Dane zaszyfrowane (bez starej historii) $(date -u +%Y-%m-%dT%H:%MZ)"
            git push -q --force origin HEAD:dane
            echo "Historia gałęzi dane wyczyszczona."; exit 0
          fi
          git add -A
          if git diff --cached --quiet; then echo "Bez zmian."; exit 0; fi
          git -c user.name="spotistats-bot" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Odsłuchy $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q origin HEAD:dane

  # Zapas na wypadek, gdy GitHub nie odpala harmonogramu (cron): po zwykłej synchronizacji
  # czeka ~25 min i odpala ją ponownie. Nowy łańcuch anuluje poprzedni, więc działa zawsze jeden.
  nastepna:
    needs: sync
    if: ${{ always() && needs.sync.result == 'success' && inputs.odlacz != true && (inputs.code == '' || inputs.code == null) }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    concurrency:
      group: spotify-relay
      cancel-in-progress: true
    steps:
      - name: Poczekaj i odpal kolejną synchronizację
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 1500
          gh workflow run spotify-sync.yml --repo "${{ github.repository }}" --ref "${{ github.event.repository.default_branch }}"
